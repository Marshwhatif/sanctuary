<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hat shots</title>
<style>body { margin: 0; background: #222; color: #fff; font: 14px system-ui; } canvas { width: 400px; height: 400px; margin: 6px; } #c3 { display: none; }</style>
</head>
<body>
<!-- Local only, not for upload: renders Ko-fi product images of a shop hat. ?send posts them to the local receiver on :8124. -->
<div id="out"></div>
<canvas id="c3" width="1200" height="1200"></canvas>
<script src="../lib/three.min.js"></script>
<script src="../lib/lowpoly-breeds.js"></script>
<script>
(async () => {
  const T = THREE, S = 1200;
  // keep in step with HATS.propeller in site/app.js
  const HAT = [[-0.0875, 0.05, -0.0875, 0.175, 0.12, 0.175, "#e2483a"], [0.0875, 0.05, -0.0875, 0.175, 0.12, 0.175, "#f0b52e"], [-0.0875, 0.05, 0.0875, 0.175, 0.12, 0.175, "#2f8fe0"], [0.0875, 0.05, 0.0875, 0.175, 0.12, 0.175, "#27b39a"], [-0.0725, 0.135, -0.0725, 0.145, 0.05, 0.145, "#e2483a"], [0.0725, 0.135, -0.0725, 0.145, 0.05, 0.145, "#f0b52e"], [-0.0725, 0.135, 0.0725, 0.145, 0.05, 0.145, "#2f8fe0"], [0.0725, 0.135, 0.0725, 0.145, 0.05, 0.145, "#27b39a"], [-0.05, 0.18, -0.05, 0.1, 0.04, 0.1, "#e2483a"], [0.05, 0.18, -0.05, 0.1, 0.04, 0.1, "#f0b52e"], [-0.05, 0.18, 0.05, 0.1, 0.04, 0.1, "#2f8fe0"], [0.05, 0.18, 0.05, 0.1, 0.04, 0.1, "#27b39a"], [0, 0.0, 0.21, 0.28, 0.025, 0.12, "#2f8fe0"], [0, 0.23, 0, 0.035, 0.06, 0.035, "#f6f4ee"], [0, 0.27, 0, 0.065, 0.03, 0.065, "#f0b52e"], [-0.13, 0.285, 0, 0.22, 0.014, 0.07, "#e2483a", "spin"], [0.13, 0.285, 0, 0.22, 0.014, 0.07, "#2f8fe0", "spin"]];
  const r = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); r.setPixelRatio(1); r.setSize(S, S, false); r.outputColorSpace = T.SRGBColorSpace;
  r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap;
  const mat = (c) => new T.MeshLambertMaterial({ color: c }), GEO = new T.BoxGeometry(1, 1, 1);
  function hat(kq, spin) { // the hat in its own space: same placement as the site (y is the box centre there too)
    const g = new T.Group(), sp = new T.Group(); g.add(sp); sp.rotation.y = spin || 0;
    HAT.forEach((a) => { const m = new T.Mesh(GEO, mat(a[6])); m.position.set(a[0] * kq, a[1] * kq, a[2] * kq); m.scale.set(a[3] * kq, a[4] * kq, a[5] * kq); m.castShadow = true; (a[7] ? sp : g).add(m); });
    return g;
  }
  function dog(id, look, pose, spin) {
    const rg = LPB.rig(id, look || ""), g = LPB.group(rg); g.update(pose || {});
    const head = g.children[0].children[1], a = rg.anchor.hat, kq = a.w / 0.34, h = hat(kq, spin); h.position.set(0, a.y, a.z); head.add(h);
    g.traverse((m) => { if (m.isMesh) m.castShadow = true; }); return g;
  }
  function scene() {
    const sc = new T.Scene(); sc.add(new T.HemisphereLight("#ffffff", "#9a8a7a", 2.0));
    const sun = new T.DirectionalLight("#fff6e8", 2.4); sun.position.set(3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.1, far: 20 }); sun.shadow.radius = 6; sun.shadow.bias = -0.0005; sc.add(sun);
    const ground = new T.Mesh(new T.PlaneGeometry(20, 20).rotateX(-Math.PI / 2), new T.ShadowMaterial({ opacity: 0.22 })); ground.receiveShadow = true; sc.add(ground);
    return sc;
  }
  const out = document.getElementById("out"), c2 = document.getElementById("c3");
  function frame(sc, cam, bg, title, sub, foot) {
    r.render(sc, cam);
    const c = c2.getContext("2d");
    const gr = c.createLinearGradient(0, 0, 0, S); gr.addColorStop(0, bg[0]); gr.addColorStop(1, bg[1]); c.fillStyle = gr; c.fillRect(0, 0, S, S);
    c.fillStyle = "rgba(255,255,255,0.16)"; [[150, 250, 1], [930, 190, 1.3], [1040, 560, 0.8], [180, 700, 0.9]].forEach(([x, y, s]) => { c.fillRect(x - 70 * s, y, 140 * s, 40 * s); c.fillRect(x - 35 * s, y - 28 * s, 80 * s, 34 * s); });
    c.drawImage(r.domElement, 0, 0);
    c.textAlign = "center"; c.textBaseline = "middle"; c.font = '900 112px system-ui, -apple-system, "Segoe UI", sans-serif';
    c.lineJoin = "round"; c.lineWidth = 22; c.strokeStyle = "#1d2b36"; c.strokeText(title, S / 2, 128); c.fillStyle = "#ffffff"; c.fillText(title, S / 2, 128);
    if (sub) { c.font = '800 46px system-ui, -apple-system, sans-serif'; c.lineWidth = 12; c.strokeText(sub, S / 2, 222); c.fillStyle = "#ffd23a"; c.fillText(sub, S / 2, 222); }
    c.font = '800 38px system-ui, -apple-system, sans-serif'; const ft = foot || "Marsh's Dog Sanctuary · marshtown.com", fw = c.measureText(ft).width + 80;
    c.fillStyle = "rgba(29,43,54,0.82)"; c.beginPath(); c.roundRect((S - fw) / 2, S - 118, fw, 76, 38); c.fill(); c.fillStyle = "#ffffff"; c.fillText(ft, S / 2, S - 79);
    return c2.toDataURL("image/png");
  }
  const shots = [];
  { // 1: the hat on its own, big
    const sc = scene(), h = hat(4.2, 0.5); h.position.y = 0.0; h.rotation.y = -0.6; sc.add(h); h.position.y = 0.2;
    const cam = new T.PerspectiveCamera(30, 1, 0.1, 50); cam.position.set(0, 2.7, 5.9); cam.lookAt(0, 0.85, 0);
    shots.push(["propeller-hat-1.png", frame(sc, cam, ["#7fd0f5", "#d8f1fc"], "PROPELLER HAT", "The blades really spin!")]);
  }
  { // 2: a golden retriever wearing it
    const sc = scene(), d = dog("golden", "", { sit: 1, look: 0.35, wag: 0.3 }, 0.7); d.rotation.y = 0.45; sc.add(d);
    const pv = d.rig.pivots[5]; d.children[0].updateMatrixWorld(true);
    const bb = new T.Box3().setFromObject(d), cy = (bb.min.y + bb.max.y) / 2, hgt = bb.max.y - bb.min.y;
    const tg = new T.Vector3((bb.min.x + bb.max.x) / 2, bb.max.y - hgt * 0.42, (bb.min.z + bb.max.z) / 2);
    const cam = new T.PerspectiveCamera(30, 1, 0.1, 50); cam.position.set(tg.x + hgt * 0.3, tg.y + hgt * 0.55, tg.z + hgt * 2.6); cam.lookAt(tg.x, tg.y - hgt * 0.02, tg.z);
    shots.push(["propeller-hat-2.png", frame(sc, cam, ["#ffcf6a", "#fff1cc"], "PROPELLER HAT", "For your dog in the sanctuary")]);
  }
  { // 3: three dogs in a row
    const sc = scene(), row = [["pug", -1.0, 0.5], ["dalmatian", 0, 0.1], ["corgi", 1.0, -0.4]]; let top = 0;
    row.forEach(([id, x, ry], i) => { const d = dog(id, "", { sit: i === 1 ? 1 : 0, look: -ry * 0.6, wag: 0.4 }, i * 1.1); d.position.x = x; d.rotation.y = ry; sc.add(d); d.updateMatrixWorld(true); top = Math.max(top, new T.Box3().setFromObject(d).max.y); });
    const cam = new T.PerspectiveCamera(30, 1, 0.1, 50); cam.position.set(0, top * 1.6, 4.7); cam.lookAt(0, top * 0.66, 0);
    shots.push(["propeller-hat-3.png", frame(sc, cam, ["#8be0b0", "#e2f8ea"], "PROPELLER HAT", "Looks great on every breed")]);
  }
  shots.forEach(([n, url]) => { const im = new Image(); im.src = url; im.title = n; out.appendChild(im); im.style.width = "260px"; im.style.margin = "6px"; });
  if (new URLSearchParams(location.search).has("send")) for (const [n, url] of shots) await fetch("http://127.0.0.1:8124/" + n, { method: "POST", body: url });
  document.title = "done";
})();
</script>
</body>
</html>
